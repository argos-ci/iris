[workspace]
members = [".", "crates/iris"]
resolver = "2"

[package]
name = "iris-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Node.js bindings for iris"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
iris = { path = "crates/iris" }
napi = "3"
napi-derive = "3"
sha2 = "0.10"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

# The test suite decodes ~35 MB of PNG fixtures; unoptimised that takes minutes.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
